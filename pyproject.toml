[project]
classifiers = []
dependencies = []
description = "."
keywords = []
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-only"
name = "x"
version = "0.1.0"

[[project.authors]]
name = "AJ Slater"
email = "aj@slater.net"

[project.urls]
News = "https://.readthedocs.io/NEWS/"
Documentation = "https://.readthedocs.io"
"Docker Image" = "https://hub.docker.com/r/ajslater/"
Issues = "https://github.com/ajslater//issues"
Source = "https://github.com/ajslater/"

[project.scripts]
x = "x.run:main"

[dependency-groups]
dev = [
  "infer-types~=1.0.0",
  "neovim~=0.3",
  "toml-cli~=0.7",
  "pypi-cleanup~=0.1.10"
]
build = []
lint = [
  "basedpyright~=1.38",
  "codespell~=2.4",
  "complexipy~=8.2",
  "pathspec~=1.1.0",
  "radon~=6.0",
  "ruff~=0.17",
  "ty~=0.0.17",
  "vulture~=2.3",
  # In lint for types
  "icecream~=2.1"
]
test = ["coverage~=7.0", "pytest-asyncio~=1.0", "pytest-cov~=7.0"]
docs = ["zensical~=0.1"]
ci = []

[build-system]
requires = ["uv_build~=0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = [
  ".*ignore",
  ".shellcheckrc",
  "bin/**",
  "bun.lock",
  "compose.yaml",
  "eslint.config.js",
  "package.json",
  "tests/**",
  "uv.lock",
  "vulture_ignorelist.py",
  "Makefile",
  "NEWS.md"
]
source-exclude = ["**/*\\~", "**/.DS_Store"]
wheel-exclude = ["**/*\\~", "**/.DS_Store"]

[tool.basedpyright]
# basedpyright also excludes "**/.*", "**/__pycache__" and "**/node_modules".
exclude = [
  "dist",
  "frontend",
  "site",
  "test-results",
  "typings",
  "vulture_ignorelist.py"
]
pythonVersion = "3.11"
failOnWarnings = false
reportAny = false
reportExplicitAny = false
reportImportCycles = true
reportIncompatibleUnannotatedOverride = true
reportMissingParameterType = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportPrivateUsage = false  # ruff does this
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownLambdaType = "hint"
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnusedCallResult = false
reportUnusedParameter = false  # ruff does this

[tool.codespell]
builtin = "clear,rare,code"
ignore-words-list = "crate,deque,falsy,iff,ro,thead,versio,wan,warmup,ws"
skip = "*.pdf,*.svg,*~,__pycache__,bun.lock,dist,htmlcov,node_modules,package.json,site,tasks,test-results,typings,uv.lock"

[tool.complexipy]
failed = true
paths = ["tests"]

[tool.coverage.html]
directory = "test-results/coverage"

[tool.coverage.run]
source = []
branch = true
concurrency = ["multiprocessing"]
omit = [
  "dist/*",
  "frontend/*",
  "node_modules/*",
  "site/*",
  "test-results/*",
  "typings/*",
  "vulture_ignorelist.py"
]

[tool.pytest]
minversion = "9.0"
addopts = [
  "--cov",
  "--cov-append",
  "--cov-report=html",
  "--cov-report=term",
  "--junit-xml=test-results/pytest/results.xml",
  "--strict-config",
  "--strict-markers",
  "-ra"
]
junit_family = "xunit2"
strict = true
testpaths = ["tests"]
pythonpath = ["."]

[tool.radon]
# radon skips hidden dirs and files itself.
exclude = """
  *~,config/*,dist/*,frontend/*,node_modules/*,site/*,test-results/*,typings/*
  ,vulture_ignorelist.py
  """

[tool.ruff]
builtins = ["ic"]
extend-exclude = [
  "**/.*",
  "frontend",
  "site",
  "test-results",
  "typings",
  "vulture_ignorelist.py"
]
show-fixes = true
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
  "BLE001",  # catch bare exception
  "COM812",  # missing trailing comma
  "COM819",  # prohibit trailing comma
  "D203",  # blank line before class docstring
  "D206",  # formatted
  "D212",  # first line multi line docstring.
  "E111",  # formatted
  "E114",  # formatted
  "E117",  # over-indented
  "E501",  # 88 char line
  "ISC001",  # formatted
  "PERF203",  # try block in loop
  "PLC0415",  # import outside top level
  "S101",  # assert
  "W191"  # formatted
]
extend-select = [
  "AIR",
  "ERA",
  "FAST",
  # ########
  # flake8 #
  # ########
  "YTT",
  # "ANN",
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  # "CPY",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FIX",
  "FA",
  "INT",
  "ISC",
  "ICN",
  "LOG",
  # "G", flake8-logging-format: stdlib %-style logging, inappropriate for loguru
  "INP",
  "PIE",
  "PYI",
  "T20",
  "PT",
  # "Q", Formatted
  "RSE",
  "RET",
  "SLF",
  "SIM",
  "SLOT",
  "TID",
  # "TD",
  "TC",
  "ARG",
  "PTH",
  # ############
  # end flake8 #
  # ############
  "FLY",
  "I",
  "C90",
  "NPY",
  "PD",
  "N",
  "PERF",
  "E",
  "W",
  # "DOC",
  "D",
  "F",
  "PGH",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "UP",
  "FURB",
  "RUF",
  "TRY"
]
external = ["V101"]
task-tags = ["TODO", "FIXME", "XXX", "http", "HACK"]

[tool.ruff.lint.flake8-self]
ignore-names = ["_meta"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D101", "D102", "T203"]
"bin/hub_prune_stale.py" = ["T201", "UP017"]
"bin/release_info.py" = ["T201"]
"bin/roman.py" = ["T201"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ty.environment]
python = "./.venv"
python-version = "3.11"

[tool.ty.src]
# ty also excludes "**/dist/", "**/node_modules/" and other build and tool dirs.
exclude = [
  "**/.*",
  "frontend",
  "site",
  "test-results",
  "typings",
  "vulture_ignorelist.py"
]

[tool.vulture]
# vulture fnmatches these against absolute paths: "*" also matches "/", "**"
# is not a globstar, and a pattern without "*?[" is wrapped as "*pattern*".
# So a pattern also matches the dirs above the project root. Name each dir as
# a whole path component, and never one that may hold a checkout, such as
# .claude: "*/.*" excluded every file of a .claude/worktrees/ checkout.
# bin/lint-vulture.sh never passes vulture the root's dot-dirs.
exclude = [
  "*/.venv/*",
  "*/dist/*",
  "*/frontend/*",
  "*/node_modules/*",
  "*/site/*",
  "*/test-results/*",
  "*/typings/*"
]
min_confidence = 61
sort_by_size = true
